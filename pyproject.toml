[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maroofiums", email = "maroofiums@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
assistant = "assistant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
